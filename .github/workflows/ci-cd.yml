name: CI/CD

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate k8s manifests
        run: |
          curl -sLO https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          ./kubeval --ignore-missing-schemas k8s/**/*.yaml k8s/*.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/ug-chmurowe-project
            git pull origin master

            docker build -t chat-backend:latest ./backend
            docker build -t chat-frontend:latest ./frontend

            kind load docker-image chat-backend:latest --name chat
            kind load docker-image chat-frontend:latest --name chat

            kubectl apply -f k8s/
            kubectl rollout restart deployment/backend deployment/frontend
            kubectl rollout status deployment/backend  --timeout=120s
            kubectl rollout status deployment/frontend --timeout=120s
