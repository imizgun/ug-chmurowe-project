name: CI/CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t chat-backend:latest -t chat-backend:${{ github.sha }} ./backend
          docker build -t chat-frontend:latest -t chat-frontend:${{ github.sha }} ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image chat-backend:latest --name chat
          kind load docker-image chat-frontend:latest --name chat

      - name: Validate and apply manifests
        run: |
          kubectl apply --dry-run=client -f k8s/
          kubectl apply -f k8s/
          kubectl rollout restart deployment/backend deployment/frontend -n chat
          kubectl rollout status deployment/backend --timeout=120s -n chat
          kubectl rollout status deployment/frontend --timeout=120s -n chat
